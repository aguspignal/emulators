plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.melondscore'
version = '0.1.0'

android {
  namespace "expo.modules.melondscore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    externalNativeBuild {
      cmake {
        // c++_shared: melonDS is C++ and the RN app already ships
        // libc++_shared.so; the Oboe prefab package also rejects c++_static.
        // CMAKE_POLICY_VERSION_MINIMUM: keeps CMake >= 4 from rejecting the
        // older cmake_minimum_required() that melonDS and teakra declare.
        arguments "-DANDROID_STL=c++_shared",
                  "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
      }
    }
    ndk {
      abiFilters "arm64-v8a", "x86_64"
    }
    consumerProguardFiles "consumer-rules.pro"
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
  // Lets find_package(oboe CONFIG) resolve the Oboe AAR's bundled CMake package.
  buildFeatures {
    prefab true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.google.oboe:oboe:1.9.3"
}
