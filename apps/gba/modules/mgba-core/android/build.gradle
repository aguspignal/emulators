plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mgbacore'
version = '0.1.0'

android {
  namespace "expo.modules.mgbacore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    externalNativeBuild {
      cmake {
        // c++_shared: the Oboe prefab package links the shared STL (and the
        // RN app ships libc++_shared.so regardless).
        // CMAKE_POLICY_VERSION_MINIMUM: mGBA declares cmake_minimum_required(3.1),
        // which CMake >= 4 refuses without this override.
        arguments "-DANDROID_STL=c++_shared",
                  "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
      }
    }
    ndk {
      abiFilters "arm64-v8a", "x86_64"
    }
    consumerProguardFiles "consumer-rules.pro"
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
  buildFeatures {
    prefab true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.google.oboe:oboe:1.9.3"
}
